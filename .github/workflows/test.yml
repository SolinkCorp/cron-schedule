name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines is >=22; consumers run on 24
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses the pnpm version from package.json `packageManager`
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc:check

      - name: Lint
        run: pnpm exec biome ci .

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build
